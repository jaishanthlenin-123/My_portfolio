<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 LED CONTROL</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #161928;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #8e99a8;
      margin: 0 0 28px 0;
      font-weight: 400;
    }
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 96px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #ffffff;
      line-height: 1.2;
    }
    .btn:hover {
      filter: brightness(1.1);
    }
    .btn-on {
      background-color: #48bb78;
    }
    .btn-off {
      background-color: #e53e3e;
    }
    .btn-active {
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
      transform: scale(1.03);
      opacity: 1;
    }
    .btn-inactive {
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <h1>ESP32 LED CONTROL</h1>
  <p>Control your LED</p>
  <div class="btn-group">
    <a href="/on" id="btnOn" class="btn btn-on btn-inactive" role="button">ON</a>
    <a href="/off" id="btnOff" class="btn btn-off btn-active" role="button">OFF</a>
  </div>

  <script>
    // State variable matching ESP32 firmware bool ledState = false;
    let ledState = false;

    const btnOn = document.getElementById('btnOn');
    const btnOff = document.getElementById('btnOff');

    function updateUi() {
      if (ledState) {
        btnOn.classList.remove('btn-inactive');
        btnOn.classList.add('btn-active');
        btnOff.classList.remove('btn-active');
        btnOff.classList.add('btn-inactive');
      } else {
        btnOn.classList.remove('btn-active');
        btnOn.classList.add('btn-inactive');
        btnOff.classList.remove('btn-inactive');
        btnOff.classList.add('btn-active');
      }
    }

    function setLed(state) {
      ledState = Boolean(state);
      updateUi();
      return { ledPin: 2, state: ledState };
    }

    btnOn.addEventListener('click', function(e) {
      e.preventDefault();
      setLed(true);
    });

    btnOff.addEventListener('click', function(e) {
      e.preventDefault();
      setLed(false);
    });

    // Simulated /status, /on, and /off endpoints matching the firmware routes
    const originalFetch = window.fetch;
    window.fetch = function(url, options) {
      const urlStr = typeof url === 'string' ? url : (url && url.url ? url.url : '');
      if (urlStr.endsWith('/status')) {
        return Promise.resolve(new Response(JSON.stringify({ ledPin: 2, state: ledState }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        }));
      }
      if (urlStr.endsWith('/on')) {
        setLed(true);
        return Promise.resolve(new Response(JSON.stringify({ ledPin: 2, state: ledState }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        }));
      }
      if (urlStr.endsWith('/off')) {
        setLed(false);
        return Promise.resolve(new Response(JSON.stringify({ ledPin: 2, state: ledState }), {
          status: 200,
          headers: { 'Content-Type': 'application/json' }
        }));
      }
      return originalFetch ? originalFetch.apply(this, arguments) : Promise.reject(new Error('Network request disabled in simulation'));
    };

    // Public programmatic helpers for simulation testing
    window.getStatus = function() {
      return { ledPin: 2, state: ledState };
    };

    window.setLedState = function(state) {
      return setLed(state);
    };

    // Initialize UI
    updateUi();
  </script>
</body>
</html>
